services:
  lighthouse:
    build: .
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      BODY_SIZE_LIMIT: 50M
    volumes:
      - lighthouse_data:/data
    networks:
      - caddy_net

volumes:
  lighthouse_data:

networks:
  caddy_net:
    external: true
    name: hollo_default
